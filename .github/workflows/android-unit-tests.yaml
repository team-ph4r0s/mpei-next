name: Android unit tests

# The Android unit tests (Robolectric Compose screens and the like) run here on every push to main:
# the `Android` workflow only builds the debug APK and runs the JVM tests of the shared modules.
# The Gradle cache is read-only here, so the end of the log is the summary of the failures, not the noise of the cache.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.unsafe.configuration-cache=false"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: adopt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --continue
        env:
          MAP_KEY: ${{ secrets.MAP_KEY }}

      - name: Summary of the failures
        if: failure()
        run: |
          echo "=== FAILED TESTS ==="
          grep -rl --include='TEST-*.xml' '<failure' modules 2>/dev/null | while read -r f; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for tc in root.iter('testcase'):
              for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                  print(f"{tc.get('classname')}.{tc.get('name')}")
                  print('   ', ((fl.get('message') or '') + '\n' + (fl.text or ''))[:700].replace('\n', '\n    '))
          PY
          done
          echo "=== END ==="

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            modules/**/build/reports/tests/
            modules/**/build/test-results/
          if-no-files-found: ignore
